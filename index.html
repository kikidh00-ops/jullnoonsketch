<!DOCTYPE html>
<html lang="en">
<head>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC12d0S5WaimVjUAQP1NrTnKVjvxbePgaY",
  authDomain: "jullnoon-sketch-9026f.firebaseapp.com",
  projectId: "jullnoon-sketch-9026f",
  storageBucket: "jullnoon-sketch-9026f.firebasestorage.app",
  messagingSenderId: "758792491594",
  appId: "1:758792491594:web:3e2a5f5b5c7d9e1f2a3b4c"
};

let dbInstance = null;
try {
  const app = initializeApp(firebaseConfig);
  dbInstance = getFirestore(app);
  window._db = dbInstance;
  window._firebaseOK = true;
  console.log("Firebase OK - cloud ON");
  window.addEventListener('load', () => {
    const el = document.getElementById('cloudStatus');
    if(el){
      el.textContent = '<span id="cloudStatus" style="background:#10B981;color:white;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;border:2px solid #059669;">☁️ 클라우드 ON</span>';
      el.style.background = '#10B981';
      el.style.color = 'white';
      el.style.border = '2px solid #059669';
    }
  });
} catch(e){
  console.error("Firebase fail", e);
  window._firebaseOK = false;
  window.addEventListener('load', () => {
    const el = document.getElementById('cloudStatus');
    if(el){
      el.textContent = '⚠️ 클라우드 OFF';
      el.style.background = '#EF4444';
      el.style.color = 'white';
    }
  });
}

window.saveCloud = async function(material, photos, folders){
  const data = {photos, folders, updatedAt: new Date().toISOString()};
  localStorage.setItem('jullnoon_'+material, JSON.stringify(data));
  if(window._db){
    try{
      await setDoc(doc(window._db, "galleries", material), data);
      console.log("Saved cloud", material, photos.length);
      const el = document.getElementById('cloudStatus');
      if(el){ el.textContent = '☁️ 클라우드 ON ✓저장됨'; setTimeout(()=>{el.textContent='☁️ 클라우드 ON';},2000); }
      return true;
    }catch(err){
      console.error("Save fail", err);
      alert('클라우드 저장 실패! Firestore 규칙을 allow read, write: if true; 로 바꾸세요! 오류: '+err.message);
      return false;
    }
  }
  return false;
};

window.loadCloud = function(material, cb){
  if(window._db){
    try{
      const ref = doc(window._db, "galleries", material);
      onSnapshot(ref, (snap)=>{
        if(snap.exists()){
          const d = snap.data();
          console.log("Cloud loaded", material, d.photos?.length);
          localStorage.setItem('jullnoon_'+material, JSON.stringify(d));
          cb(d.photos||[], d.folders||[]);
        }else{
          const backup = localStorage.getItem('jullnoon_'+material);
          if(backup){ const d=JSON.parse(backup); cb(d.photos||[], d.folders||[]); }
          else cb([],[]);
        }
      }, (err)=>{
        console.error("Snapshot err", err);
        const backup = localStorage.getItem('jullnoon_'+material);
        if(backup){ const d=JSON.parse(backup); cb(d.photos||[], d.folders||[]); }
        else cb([],[]);
      });
    }catch(e){
      const backup = localStorage.getItem('jullnoon_'+material);
      if(backup){ const d=JSON.parse(backup); cb(d.photos||[], d.folders||[]); }
    }
  }else{
    const backup = localStorage.getItem('jullnoon_'+material);
    if(backup){ const d=JSON.parse(backup); cb(d.photos||[], d.folders||[]); }
    else cb([],[]);
  }
};
</script>
